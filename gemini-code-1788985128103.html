<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบทดสอบออนไลน์ - กรุงเทพประกันชีวิต</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bla: {
              DEFAULT: '#0033A0',
              dark: '#002270',
              light: '#0047BA',
              soft: '#E8F0FE',
              orange: '#FF6B00',
              orangeHover: '#E05D00'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden min-h-[540px] flex flex-col justify-between p-6 relative border border-slate-200">
    
    <!-- Header Logo -->
    <div class="text-center pt-2 pb-4 border-b border-slate-100">
      <!-- หากใช้รูปภาพในเครื่อง ให้เปลี่ยน src เป็นชื่อไฟล์รูปภาพ เช่น src="logo.png" -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/eb/Bangkok_Life_Assurance_Logo.svg" 
           alt="กรุงเทพประกันชีวิต Logo" 
           class="h-12 mx-auto object-contain">
    </div>

    <!-- หน้าแรก (Welcome) -->
    <div id="welcome-screen" class="flex flex-col justify-between h-full my-auto space-y-6 pt-4">
      <div class="text-center space-y-3">
        <div class="inline-block p-3.5 bg-bla-soft text-bla rounded-full mb-1">📝</div>
        <h1 class="text-xl font-bold text-bla">แบบทดสอบความรู้ประกันภัย</h1>
        <p class="text-slate-500 text-sm leading-relaxed">
          ยินดีต้อนรับสู่แบบทดสอบทบทวนความรู้ <br>
          โปรดเลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียวในแต่ละข้อ
        </p>
      </div>

      <div class="bg-bla-soft/50 p-4 rounded-xl border border-blue-100 space-y-2 text-sm text-slate-600">
        <div class="flex justify-between"><span>จำนวนข้อสอบ:</span> <span class="font-bold text-bla" id="total-questions-count">กำลังโหลด...</span></div>
        <div class="flex justify-between"><span>เกณฑ์การตัดสิน:</span> <span class="font-semibold text-slate-700">แสดงผลหลังทำเสร็จ</span></div>
      </div>

      <button id="start-btn" disabled onclick="startQuiz()" class="w-full bg-slate-300 text-slate-500 font-semibold py-3.5 px-4 rounded-xl transition cursor-not-allowed">
        กำลังโหลดข้อสอบ...
      </button>
    </div>

    <!-- หน้าทำแบบทดสอบ (Quiz) -->
    <div id="quiz-screen" class="hidden flex-col justify-between h-full pt-4">
      <div>
        <div class="flex justify-between items-center text-xs font-semibold text-slate-400 mb-2">
          <span id="question-number" class="text-bla font-bold">ข้อที่ 1</span>
          <span id="quiz-progress-text">1/1</span>
        </div>
        <div class="w-full bg-slate-100 h-2 rounded-full mb-5 overflow-hidden">
          <div id="progress-bar" class="bg-bla h-full w-0 transition-all duration-300"></div>
        </div>

        <h2 id="question-text" class="text-base font-bold text-slate-800 mb-5 leading-snug"></h2>
        <div id="options-container" class="space-y-2.5"></div>
      </div>

      <div class="space-y-2.5 mt-6">
        <button id="next-btn" onclick="nextQuestion()" disabled class="w-full bg-slate-200 text-slate-400 font-semibold py-3.5 px-4 rounded-xl transition cursor-not-allowed">
          ถัดไป
        </button>
        <button onclick="confirmEarlyFinish()" class="w-full bg-bla-orange hover:bg-bla-orangeHover text-white font-medium py-2.5 px-4 rounded-xl transition text-sm active:scale-[0.98]">
          🏁 จบการทดสอบทันที
        </button>
      </div>
    </div>

    <!-- หน้าสรุปผลและเฉลย (Result) -->
    <div id="result-screen" class="hidden flex-col justify-between h-full space-y-5 pt-4">
      <div>
        <div class="text-center space-y-1.5 mb-4">
          <h2 class="text-lg font-bold text-slate-800">ผลการทำแบบทดสอบ</h2>
          <div class="text-3xl font-extrabold text-bla my-2" id="score-text">0 / 0</div>
          <p id="score-feedback" class="text-xs font-medium text-slate-500"></p>
        </div>

        <hr class="border-slate-100 my-3">

        <h3 class="font-bold text-slate-700 mb-2 text-xs">ทบทวนคำตอบและเฉลย:</h3>
        <div id="review-container" class="space-y-3 max-h-[240px] overflow-y-auto pr-1 text-xs"></div>
      </div>

      <button onclick="restartQuiz()" class="w-full bg-bla hover:bg-bla-dark text-white font-semibold py-3.5 px-4 rounded-xl shadow-md transition active:scale-[0.98]">
        ทำแบบทดสอบอีกครั้ง
      </button>
    </div>

  </div>

  <script>
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzHFMwYYsi15z7-aalsXp0uDcHbwT_L3KJH_S8q8b8bDAeP3mp8Q0dAslkXXG9hz7LVxA/exec";

    let quizData = [];
    const prefixMap = ["ก.", "ข.", "ค.", "ง."];
    let currentQuestionIndex = 0;
    let selectedOptionIndex = null;
    let userAnswers = [];

    // ฟังก์ชั่นสำหรับสุ่มลำดับข้อมูลใน Array (Fisher-Yates Shuffle)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    async function fetchQuestions() {
      try {
        const response = await fetch(GOOGLE_SHEET_API_URL);
        const data = await response.json();

        // สุ่มลำดับข้อสอบเมื่อดึงข้อมูลสำเร็จ
        quizData = shuffleArray(data);

        document.getElementById('total-questions-count').innerText = `${quizData.length} ข้อ`;
        const startBtn = document.getElementById('start-btn');
        startBtn.disabled = false;
        startBtn.innerText = "เริ่มทำแบบทดสอบ";
        startBtn.className = "w-full bg-bla hover:bg-bla-dark text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-900/20 transition active:scale-[0.98] cursor-pointer";
      } catch (error) {
        console.error("Error fetching quiz data:", error);
        document.getElementById('total-questions-count').innerText = "เกิดข้อผิดพลาดในการโหลด";
      }
    }

    function startQuiz() {
      if (quizData.length === 0) return;
      currentQuestionIndex = 0;
      userAnswers = [];
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      document.getElementById('quiz-screen').classList.add('flex');
      loadQuestion();
    }

    function loadQuestion() {
      selectedOptionIndex = null;
      const currentQuiz = quizData[currentQuestionIndex];
      
      document.getElementById('question-number').innerText = `ข้อที่ ${currentQuestionIndex + 1}`;
      document.getElementById('quiz-progress-text').innerText = `${currentQuestionIndex + 1}/${quizData.length}`;
      const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      // แสดงลำดับข้อที่ 1, 2, 3... เรียงตามปกติ
      document.getElementById('question-text').innerText = `ข้อ ${currentQuestionIndex + 1}. ${currentQuiz.question}`;

      const nextBtn = document.getElementById('next-btn');
      nextBtn.disabled = true;
      nextBtn.className = "w-full bg-slate-200 text-slate-400 font-semibold py-3.5 px-4 rounded-xl transition cursor-not-allowed";
      nextBtn.innerText = (currentQuestionIndex === quizData.length - 1) ? "ส่งแบบทดสอบ" : "ถัดไป";

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      currentQuiz.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.className = `w-full text-left p-3.5 rounded-xl border border-slate-200 hover:border-bla hover:bg-bla-soft/40 transition flex items-start space-x-3 text-slate-700 font-medium text-sm`;
        button.onclick = () => selectOption(index);
        button.id = `option-${index}`;
        button.innerHTML = `
          <span class="font-bold text-bla min-w-[20px]">${prefixMap[index]}</span>
          <span class="leading-relaxed">${option}</span>
        `;
        optionsContainer.appendChild(button);
      });
    }

    function selectOption(index) {
      selectedOptionIndex = index;

      quizData[currentQuestionIndex].options.forEach((_, i) => {
        const btn = document.getElementById(`option-${i}`);
        if (i === index) {
          btn.className = "w-full text-left p-3.5 rounded-xl border-2 border-bla bg-bla-soft text-bla font-medium flex items-start space-x-3 text-sm shadow-sm";
        } else {
          btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-200 opacity-60 flex items-start space-x-3 text-slate-700 font-medium text-sm";
        }
      });

      const nextBtn = document.getElementById('next-btn');
      nextBtn.disabled = false;
      nextBtn.className = "w-full bg-bla hover:bg-bla-dark text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-900/20 transition active:scale-[0.98] cursor-pointer";
    }

    function nextQuestion() {
      if (selectedOptionIndex === null) return;
      userAnswers.push(selectedOptionIndex);

      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function confirmEarlyFinish() {
      if (selectedOptionIndex !== null) {
        userAnswers.push(selectedOptionIndex);
      }
      
      const answeredCount = userAnswers.length;
      if (answeredCount === 0) {
        if (confirm("คุณยังไม่ได้ตอบคำถามเลย ต้องการออกและดูผลคะแนนทันทีหรือไม่?")) {
          showResults();
        }
      } else {
        if (confirm(`คุณทำแบบทดสอบไปแล้ว ${answeredCount} ข้อ ต้องการจบการทดสอบเพื่อดูคะแนนทันทีหรือไม่?`)) {
          showResults();
        }
      }
    }

    function showResults() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('flex');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('flex');

      let score = 0;
      const reviewContainer = document.getElementById('review-container');
      reviewContainer.innerHTML = '';

      const answeredQuestions = quizData.slice(0, userAnswers.length);

      answeredQuestions.forEach((quiz, index) => {
        const userChoice = userAnswers[index];
        const isCorrect = userChoice === quiz.correctIndex;
        if (isCorrect) score++;

        const reviewCard = document.createElement('div');
        reviewCard.className = `p-3 rounded-xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/40' : 'border-rose-200 bg-rose-50/40'} space-y-1.5`;
        
        reviewCard.innerHTML = `
          <div class="font-bold text-slate-800 flex justify-between items-start">
            <span>ข้อ ${index + 1}. ${quiz.question}</span>
            <span>${isCorrect ? '✔️' : '❌'}</span>
          </div>
          <div class="text-[11px] space-y-1 mt-1">
            <div class="${isCorrect ? 'text-emerald-700 font-semibold' : 'text-rose-600 font-semibold'}">
              คำตอบของคุณ: ${prefixMap[userChoice]} ${quiz.options[userChoice]}
            </div>
            ${!isCorrect ? `
              <div class="text-emerald-700 font-semibold">
                เฉลยที่ถูกต้อง: ${prefixMap[quiz.correctIndex]} ${quiz.options[quiz.correctIndex]}
              </div>
            ` : ''}
          </div>
        `;
        reviewContainer.appendChild(reviewCard);
      });

      const totalAttempted = userAnswers.length;
      document.getElementById('score-text').innerText = `${score} / ${totalAttempted}`;
      
      if (totalAttempted === 0) {
        document.getElementById('score-feedback').innerText = "คุณยังไม่ได้ทำแบบทดสอบเลย";
      } else if (score === totalAttempted) {
        document.getElementById('score-feedback').innerText = `ตอบถูกทั้งหมด ${score} ข้อ จากที่ทำไป ${totalAttempted} ข้อ!`;
      } else {
        document.getElementById('score-feedback').innerText = `ตอบถูก ${score} ข้อ จากที่ทำไปทั้งหมด ${totalAttempted} ข้อ`;
      }
    }

    function restartQuiz() {
      // สุ่มลำดับข้อสอบใหม่อีกครั้งสำหรับการทำรอบใหม่
      quizData = shuffleArray(quizData);
      startQuiz();
    }

    fetchQuestions();
  </script>
</body>
</html>
